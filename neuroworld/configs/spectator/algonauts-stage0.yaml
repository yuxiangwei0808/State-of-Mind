# Spectator, step 1 (stage 0): the fast map, a linear map of the newest 5 fMRI frames to 1,024 values, trained by forecasting
# fMRI with no movie input (a 6-block Transformer predictor and a readout to parcels, both discarded afterwards). No early stopping;
# the epoch with the best forecast correlation on Friends S6 is kept (epoch 23). Run as phase0-k5; frozen copy: ${NEUROWORLD_OUTPUT}/spectator-v1/algonauts/stage0.
