# Shared HCP 7T movie settings, read by the benchmark and by Spectator's HCP config. A training run needs a design
# YAML that names this file as its base (see configs/algonauts/ for the designs).
seed: 0
wandb:
  project: neuralworld
  entity: null
  name: null
  mode: online
data:
  bundle_path: ${NEUROWORLD_DATA}/hcp_movies/derivatives/neuroworld-schaefer1000-v2
  tr_seconds: 1.0
  # Chosen by a scan of a stimulus-only ridge (pooled, on the three rows a step sees, fitted on
  # training frames, scored on validation frames): parcel Pearson 0.072 / 0.084 / 0.089 / 0.091 / 0.086 / 0.077 for rows starting 0-5 s before the target.
  hrf_delay_seconds: 3.0
  sequence_states: 19  # context_states (3) + train.rollout_steps (16)
  window_stride_trs: 3
  # Splits (data/splits.py), after Khosla et al. (2020, arXiv 2006.15802): train and validate on
  # MOVIE1-3 (run-01..03), test on MOVIE4 (run-04).
  # Validation holds out one clip of each training movie, the last before the repeated clip, with
  # the rest that follows it (frames [start, next clip)), for every subject; Khosla's random 9:1
  # split of TRs would leak between neighbouring frames in a forecasting model. Every run ends with
  # the same 84-s test-retest clip: it stays in training and is cut from validation and test.
  # Pre and post subjects saw two releases of the same clips on the same clock.
  # TRIBEv2 never trained on HCP brain data, so these scores test the complete pipeline.
  train_runs: ['HCP7T/*/task-movie/run-0[1-3]/dir-*']
  val_runs: ['HCP7T/*/task-movie/run-0[1-3]/dir-*']
  test_runs: ['HCP7T/*/task-movie/run-04/dir-*']
  split_frames:
    train:
      'HCP7T/*/task-movie/run-01/*': [[0, 734], [817, 921]]
      'HCP7T/*/task-movie/run-02/*': [[0, 545], [814, 918]]
      'HCP7T/*/task-movie/run-03/*': [[0, 649], [811, 915]]
    val:
      'HCP7T/*/task-movie/run-01/*': [[734, 817]]  # MOVIE1 clip 4 (64 s)
      'HCP7T/*/task-movie/run-02/*': [[545, 814]]  # MOVIE2 clip 3 (250 s)
      'HCP7T/*/task-movie/run-03/*': [[649, 811]]  # MOVIE3 clip 4 (143 s)
    test:
      'HCP7T/*/task-movie/run-04/*': [[0, 797]]  # MOVIE4 clips 1-3, without the repeated clip
  # Reserved for new-subject evaluation, used by no split: 20% of the subjects with all four runs,
  # drawn per stimulus release (29 pre, 7 post; numpy default_rng(0), sorted subject IDs).
  heldout_subjects: [HCP7T/100610, HCP7T/104416, HCP7T/105923, HCP7T/116726, HCP7T/118225, HCP7T/126426,
                     HCP7T/134829, HCP7T/140117, HCP7T/158035, HCP7T/169343, HCP7T/175237, HCP7T/177140,
                     HCP7T/178142, HCP7T/191033, HCP7T/192439, HCP7T/199655, HCP7T/200210, HCP7T/200614,
                     HCP7T/204521, HCP7T/205220, HCP7T/214019, HCP7T/214524, HCP7T/263436, HCP7T/346137,
                     HCP7T/360030, HCP7T/412528, HCP7T/525541, HCP7T/541943, HCP7T/581450, HCP7T/671855,
                     HCP7T/706040, HCP7T/725751, HCP7T/732243, HCP7T/765864, HCP7T/943862, HCP7T/971160]
  batch_size: 1024  # global; 8 GPUs x 128, so each GPU's SIGReg sees LeWM's 128 windows
  num_workers: 4
  preload: true  # read the selected arrays into RAM once; NFS reads per window throttle the GPU
  # Rows for model.stimulus_features: tribev2_context, prepared by python -m neuroworld.nbs_data.stimuli.tribev2_context
  # (November 10, as for Algonauts: causal attention).
  context_features: ${NEUROWORLD_DATA}/hcp_movies/derivatives/neuroworld-schaefer1000-v2-tribev2-context
model:
  state_window_trs: 3
  context_states: 3
  state_dim: 1024
  predictor_depth: 6
  attention_heads: 16
  predictor_mlp_dim: 2048
  predictor_dropout: 0.1
  # Stimulus context (models/stimulus_context.py): none = one movie row per transition, delayed
  # by data.hrf_delay_seconds; concat = stimulus_context_trs rows side by side (no new module);
  # linear = one layer downsampling those rows to 1152. The newest row sits at that delay.
  stimulus_context: none
  stimulus_context_trs: 1
  stimulus_features: projections  # or tribev2_context (needs data.context_features)
  tribev2_checkpoint: ${NEUROWORLD_DATA}/hub/models--facebook--tribev2/snapshots/f894e783020944dcd96e5568550afe2aa9743f9f/best.ckpt
train:
  epochs: 100
  lr: 0.00005
  warmup_fraction: 0.01  # LeWM: linear warmup over 1% of all optimizer steps
  schedule: cosine
  weight_decay: 0.001
  grad_clip: 1.0
  precision: bf16
  sigreg_weight: 0.09  # used only by the joint world model (the only design that trains a latent encoder)
  sigreg_knots: 17
  sigreg_projections: 1024
  rollout_steps: 16  # 16-step rollout loss, used by every design
  rollout_weight: 1.0
  modality_dropout: 0.0  # TRIBEv2 uses 0.3: drop each modality (with tribev2_context, the whole row) per training sample
  device: auto
  log_every_steps: 100
  output_dir: null  # null: checkpoints/<dataset>/<run name built from the settings>
eval:
  prefix_trs: 1
  horizon_trs: 20
  window_stride_trs: 20
  probe_windows: 4096  # training windows for the checkpoint-selection ridge probe
  probe_ridge: 0.1
readout:
  hidden_dim: 1024  # 0: no shared trunk, one linear map per subject
  epochs: 200
  lr: 0.00001  # 1e-3 overfits within a few epochs; 1e-5 reaches a stable plateau
  warmup_steps: 500
  schedule: cosine
  weight_decay: 0.001
  batch_size: 16  # global, as in NeuroWorld
  train_horizon_trs: 20
  window_stride_trs: 20
  train_on: rollout  # validation always decodes rollouts
  cache_rollouts: true
  select_by: parcel_pearson  # or fmri_mse; both are logged every epoch
